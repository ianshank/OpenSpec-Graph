# gitleaks config for planlint.
# Runs in CI (gitleaks action) and locally via `make security` (real gitleaks if
# installed, deterministic Python fallback otherwise). Test fixtures that
# legitimately contain fake tokens are allowlisted by path.

title = "planlint secret scan"

# A gitleaks --config file REPLACES the built-in ruleset entirely unless it
# explicitly extends it -- without this, the file below only ever adds an
# allowlist on top of zero rules, so real gitleaks (both `make security` and
# CI's gitleaks-action) never detects anything, silently. Verified: an AWS
# example key goes undetected without this block, detected with it.
[extend]
useDefault = true

[allowlist]
description = "vendored and generated paths that may contain fake secrets; test sources are scanned (a real secret in a test must fail)"
paths = [
  '''.git/.*''',
  '''.venv/.*''',
  '''node_modules/.*''',
]
