[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openspec-graph"
version = "0.1.0"
description = "Graft an OpenSpec discipline onto a cloned repository and enforce it mechanically."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
specgraph = "openspec_graph.cli:main"

[tool.setuptools.packages.find]
include = ["openspec_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
# The coverage floor for this repo. Specs must reference this locator,
# never hard-code a number (specgraph rule G003).
fail_under = 90
