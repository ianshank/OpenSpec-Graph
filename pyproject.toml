[build-system]
# 77 is the floor that understands the PEP 639 `license` SPDX string and
# `license-files` glob used below. The migration was previously deferred
# because setuptools 77 also requires `packaging>=24.2` at build time, and
# that could not be verified against this machine's distro-managed
# packaging 24.0. That premise no longer holds: `python -m build` resolves
# the build requirements in an isolated environment, which installs a
# modern setuptools and packaging regardless of what the ambient
# interpreter ships, and the wheel builds clean there.
#
# Raised together with the form switch, in one commit, exactly as
# docs/next-steps.md required: a floor without the SPDX string buys
# nothing, and the SPDX string without the floor fails to build on an old
# setuptools instead of merely warning.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Renamed from `openspec-graph` to match the `planlint` command this project
# has shipped since the rename-cli-and-positioning change. Contributors with
# the old editable install should `pip uninstall openspec-graph` first: two
# distributions mapping the same import name make `--version`'s
# `packages_distributions()` lookup pick between them in undefined order.
name = "planlint"
dynamic = ["version"]
description = "Lint implementation plans and specs against a repository's executable facts."
readme = "README.md"
# PEP 639: an SPDX expression, not the deprecated table form, plus the glob
# naming the files that carry the licence text. `license-files` is what puts
# LICENSE inside the wheel's .dist-info/licenses/ directory; the classifier
# that used to duplicate this claim is gone, because PEP 639 forbids pairing
# a `License ::` classifier with an SPDX expression.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Deliberately empty, and load-bearing: see docs/architecture/c4.md and
# docs/hooks.md's "Adding a new pure derived-output module" convention.
dependencies = []
keywords = ["openspec", "speckit", "specs", "lint", "governance", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    # No "License ::" classifier: PEP 639 forbids one alongside the SPDX
    # `license` expression above, and setuptools>=77 rejects the pair.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ianshank/planlint"
Repository = "https://github.com/ianshank/planlint"
Changelog = "https://github.com/ianshank/planlint/blob/main/CHANGELOG.md"
Issues = "https://github.com/ianshank/planlint/issues"

[project.scripts]
# `planlint` is the primary command. `specgraph` is a backwards-compatible
# deprecated alias: it prints a one-line warning to stderr, then delegates to
# `main` and preserves the real exit code (so existing CI that runs
# `specgraph validate` keeps failing on real errors, never silently passing).
planlint = "openspec_graph.cli:main"
specgraph = "openspec_graph.cli:main_deprecated"

[tool.setuptools.dynamic]
# Single version source (DEC-SD-009). `attr:` reads the literal statically
# from openspec_graph/__init__.py without importing the package at build time.
version = { attr = "openspec_graph.__version__" }

[tool.setuptools.packages.find]
# The wheel ships the CLI only. `skills/`, `.claude-plugin/`, and `evals/`
# are distributed through the git repository (the plugin marketplace installs
# from the repo, not from a wheel), so they are deliberately not packaged.
include = ["openspec_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["openspec_graph"]
branch = true
# Activates pytest-cov's own auto-installed subprocess-coverage hook (a
# .pth file it drops into site-packages that calls coverage.process_startup()
# on every interpreter start whenever COVERAGE_PROCESS_START is set --
# tests/support.py's run_cli() sets it) to track the real CLI subprocesses
# run_cli() launches -- without this, every line reachable only through
# a subprocess invocation is
# structurally invisible to the coverage report, no matter how well tested.
parallel = true

[tool.coverage.report]
# The line-coverage floor for this repo. Specs and CI config must reference
# this locator, never hard-code a number (specgraph rule G003 / C-CH-2).
fail_under = 90

[tool.specgraph]
# The branch-coverage floor, enforced by tools/check_branch_coverage.py.
# Lives outside [tool.coverage.*] so coverage.py doesn't warn about an unknown
# key — it's specgraph's own gate, read directly from this section.
# Lower than the line floor: branches are harder to cover, but a module with
# high line coverage and untested conditional branches must still fail.
branch_fail_under = 80

# Accuracy floors for the two matchers that read English prose rather than
# structure, scored by `tools/matcher_accuracy.py` against
# `tests/fixtures/phrasing/` and enforced by `tests/test_matcher_accuracy.py`.
#
# Here rather than in the Makefile or a workflow for the same reason as every
# other threshold in this project: rule G003 says a threshold belongs in
# config, and `tools/check_no_hardcoded_thresholds.py` enforces it. A
# governance tool that hard-codes its own numbers argues against its own rule.
#
# Integer percentages so they reuse `_common.read_pyproject_int`, the reader
# the coverage gates already use, instead of adding a second config parser.
#
# Each floor is chosen by how many ADDITIONAL errors it tolerates at the
# current corpus size, and that count is recorded here, because a floor that
# tolerates zero is a floor at the measurement whatever its nominal distance.
# Slack exists for two honest reasons: a recall-gaining pattern normally costs
# a little precision, and adversarial corpus rows are meant to keep being
# added. Measured when these landed (re-measure with `make matcher-accuracy`):
#   G002  precision 0.919 (57/62), recall 0.983 (57/58), n=119
#         -> 88 tolerates two more false positives; 90 tolerates five misses
#   U004  precision 0.938 (15/16), recall 1.000 (15/15), n=33
#         -> 82 tolerates two more false positives; 90 tolerates one miss
#
# Raising a floor is a deliberate act. Lowering one needs a reason in the
# commit message, because it means the matcher got worse.
g002_min_precision_pct = 88
g002_min_recall_pct = 90
u004_min_precision_pct = 82
u004_min_recall_pct = 90

[project.optional-dependencies]
# tomli backports stdlib tomllib (3.11+) for coverage.process_startup()'s
# config-file parsing on the 3.10 leg of the CI matrix; coverage itself
# declares zero dependencies, so this is required, not merely convenient.
#
# `hypothesis` powers tests/test_properties.py. Dev-only and deliberately so:
# `[project] dependencies` stays empty (see its own comment), and a property
# test is a contributor/CI tool, never something an adopter installing the CLI
# should be made to carry.
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "hypothesis",
    "tomli; python_version < \"3.11\"",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's default selection is E4/E7/E9 + F only. Everything below was
# therefore unenforced, including the `S` rules the per-file-ignores already
# named -- an ignore list for rules that were never on is config that looks
# like a gate and is not, which is the same class of defect this project
# exists to catch in other people's repositories.
#
# Chosen for signal over volume: every family here was at or near zero
# violations when it was turned on, so each one locks in a property the code
# already has rather than starting a cleanup backlog.
select = [
    "E4", "E7", "E9", "F",  # ruff's defaults, kept explicit
    "I",    # import sorting -- the diff-noise class no reviewer should arbitrate
    "B",    # bugbear: mutable defaults, loop-variable capture, silent no-ops
    "S",    # bandit: subprocess and deserialization hazards, in a tool that
            # reads untrusted repositories for a living
    "UP",   # pyupgrade, floored at the `requires-python` this project declares
    "SIM",  # simplifications that remove a branch rather than reword one
    "RET",  # return-path consistency
    "C4",   # comprehension forms
    "PIE", "ICN", "TID", "EXE", "ISC", "Q",  # small, mechanical, zero-violation
    "DTZ",  # naive datetimes -- witness records carry timestamps
    "N",    # PEP 8 naming
    "RUF",  # ruff's own checks, incl. unused-noqa
]
# Deliberately NOT selected, each for a stated reason rather than by omission:
#   E501  -- the line-length limit above is real but currently unmet in ~100
#            places, most of them predating this config. Enabling it and
#            rewrapping them is owed work, tracked in docs/next-steps.md, not
#            something to bundle into an unrelated change.
#   ERA   -- flags prose comments that quote markdown headings as dead code;
#            the false-positive rate here is most of the hits.
#   T20   -- this is a CLI. `print` is the product.
#   ANN/D -- annotation and docstring coverage in tests; large, low-yield.
#   PL    -- Pylint refactor heuristics; opinions, not defects.

[tool.ruff.lint.per-file-ignores]
# tests use assert and subprocess intentionally; tools are scripts, not a package.
"tests/*" = ["S101", "S603", "S607"]
"tools/*" = ["S603", "S607", "INP001"]

[tool.mypy]
# Pragmatic strictness: the package uses dataclasses, regex parsing, and
# dict-based graph nodes. Full strict mode would demand large annotation
# surface for little safety gain; this config catches real type errors.
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
files = ["openspec_graph", "tools"]
