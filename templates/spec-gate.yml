# Drop into .github/workflows/spec-gate.yml in the target repository.
#
# ``planlint detect`` is read-only and always runs, so dialect/threshold drift shows
# up in the log even when the gate passes. ``planlint validate`` is the gate itself.
name: spec-gate

on:
  pull_request:
    paths:
      # Both spec-tree layouts planlint understands: an OpenSpec `openspec/`
      # tree and a SpecKit `specs/` tree. Listing only the former meant a
      # SpecKit repo never triggered the gate it had just installed.
      - "openspec/**"
      - "specs/**"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install planlint
        # Pinned to a compatible range, not bare: this workflow is copied
        # into other repositories, where an unpinned install would pull a
        # future major with a different exit-code contract straight into
        # their CI. Requires planlint on PyPI (published by the v* tag).
        run: pip install --quiet "planlint>=0.2.0,<1"

      - name: Report detected conventions
        run: planlint detect

      - name: Validate every change package
        run: planlint validate --fail-on ERROR

      # Warnings are recorded as an artifact rather than failing the build, so
      # the WARN backlog is visible without blocking unrelated work.
      - name: Record warnings
        if: always()
        run: planlint validate --fail-on WARN --json > spec-findings.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-findings
          path: spec-findings.json
