# Hook definitions for repositories that consume planlint.
#
# Distinct from `.pre-commit-config.yaml` in this same directory, which is
# what contributors to *this* repository run: that one calls `make` targets
# only this checkout has. This file is the adopter-facing half, and must never
# assume anything about the repository it is installed into beyond the CLI.
#
#   repos:
#     - repo: https://github.com/ianshank/planlint
#       rev: v0.2.0
#       hooks:
#         - id: planlint
- id: planlint
  name: planlint (spec gate)
  description: Fail when a spec cites machinery this repository does not have.
  entry: planlint --target . validate --fail-on ERROR
  language: python
  # The gate is a property of the whole tree, not of one changed file: a rule
  # like "this declared invariant is cited by no living spec" cannot be
  # answered from a file list. So it runs once per commit, with no filenames
  # appended, rather than once per staged spec.
  pass_filenames: false
  always_run: true

- id: planlint-detect
  name: planlint (report detected conventions)
  description: Print the stack, dialect, threshold locator and make targets planlint detects.
  entry: planlint --target . detect
  language: python
  pass_filenames: false
  always_run: true
  # Informational, never blocking: it reports what the gate is measuring
  # against, which is the context a finding is phrased in.
  verbose: true
