name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (hard gate — ruff, never silently skipped)
        run: make lint

      - name: Run tests with line + branch coverage gates
        run: make test

  self-validate:
    # specgraph must hold its own specs to the same rules it enforces.
    # Hard gate: if any change package in openspec/ fails a rule, the build
    # fails — no skip, no soft pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report detected conventions
        run: specgraph --target . detect

      - name: Validate every change package (hard gate)
        run: specgraph --target . validate --fail-on ERROR

      - name: Emit spec dependency graph
        run: specgraph --target . graph --format json > spec-graph.json

      - name: Record warnings as an artifact
        if: always()
        run: specgraph --target . validate --fail-on WARN --json > spec-findings.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-artifacts
          path: |
            spec-graph.json
            spec-findings.json

  graph-diff:
    # Fail a PR whose spec graph regresses: more broken_links than the merge-base,
    # or a new orphan requirement (AC-CH-5, AC-CH-6). The base is the merge-base
    # of the PR and its base branch (DEC-CH-001) — not origin/main — so the gate
    # only flags drift THIS PR introduces, never drift from a rebase.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build graph on PR head
        run: specgraph --target . graph --format json > head.json

      - name: Build graph on merge-base
        run: |
          git fetch origin "${{ github.base_ref }}"
          BASE=$(git merge-base HEAD origin/"${{ github.base_ref }}")
          git worktree add /tmp/base "$BASE"
          specgraph --target /tmp/base graph --format json > base.json
          git worktree remove /tmp/base

      - name: Diff graphs (fail on new broken edges or orphans)
        run: python tools/diff_spec_graph.py base.json head.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-graph-diff
          path: |
            base.json
            head.json
