name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  self-validate:
    # specgraph must hold its own specs to the same rules it enforces.
    # This is a hard gate: if any change package in openspec/ fails a rule,
    # the build fails — no skip, no soft pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report detected conventions
        run: specgraph --target . detect

      - name: Validate every change package (hard gate)
        run: specgraph --target . validate --fail-on ERROR

      - name: Record warnings as an artifact
        if: always()
        run: specgraph --target . validate --fail-on WARN --json > spec-findings.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-findings
          path: spec-findings.json
