name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (hard gate — ruff, never silently skipped)
        run: make lint

      - name: Type check (hard gate — mypy, config in pyproject.toml)
        run: make typecheck

      - name: Run tests with line + branch coverage gates
        run: make test

  test-windows:
    # The suite's platform guard tests (path separators, console encoding,
    # symlink privilege) only mean something if one leg actually runs on the
    # OS they guard -- ubuntu-only CI let two Windows-only defects ship
    # (fix-windows-path-separator-leak, fix-stdout-encoding-crash), and a
    # third (tests/test_findings_envelope.py's two-checkout normalization)
    # was caught only by a manual Windows run.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install make (not preinstalled on the Windows runner image)
        run: choco install make -y

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (hard gate)
        run: make lint

      - name: Type check (hard gate)
        run: make typecheck

      - name: Run tests with line + branch coverage gates
        run: make test

  encoding-stress:
    # Reproduces the environment that crashed `planlint validate` before the
    # fix-stdout-encoding-crash change: a console that cannot encode
    # non-ASCII. Runs the no-mocks live track end to end under it.
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: ascii
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Live self-validation under an ASCII-only console (hard gate)
        run: make e2e-live

  self-validate:
    # planlint must hold its own specs to the same rules it enforces.
    # Hard gate: if any change package in openspec/ fails a rule, the build
    # fails — no skip, no soft pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report detected conventions
        run: planlint --target . detect

      - name: Validate every change package (hard gate)
        run: planlint --target . validate --fail-on ERROR

      - name: Emit spec dependency graph
        run: planlint --target . graph --format json > spec-graph.json

      - name: Record warnings as an artifact
        if: always()
        run: planlint --target . validate --fail-on WARN --json > spec-findings.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-artifacts
          path: |
            spec-graph.json
            spec-findings.json

  packaging:
    # The licence metadata is only observable in a built artifact, and the
    # release workflow is the only place that ever built one — so a packaging
    # regression could not surface until a tag was already pushed, against an
    # index whose versions are immutable. This runs the same check on every
    # pull request instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build the wheel in an isolated environment
        run: python -m build --wheel --outdir dist

      - name: Confirm the wheel carries its declared licence
        run: python tools/check_wheel_metadata.py dist

  graph-diff:
    # Fail a PR whose spec graph regresses: more broken_links than the merge-base,
    # or a new orphan requirement (AC-CH-5, AC-CH-6). The base is the merge-base
    # of the PR head and its base branch (DEC-CH-001) — not origin/main — so the
    # gate only flags drift THIS PR introduces, never drift from a rebase or a
    # sibling PR merged after this one branched off.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Checkout the PR head SHA (NOT the default synthetic merge commit) so
      # merge-base resolves to the true branch point (DEC-CH-001 resolution).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build graph on PR head
        run: planlint --target . graph --format json > head.json

      - name: Build graph on merge-base
        run: |
          git fetch origin "${{ github.base_ref }}"
          BASE=$(git merge-base HEAD origin/"${{ github.base_ref }}")
          git worktree add /tmp/base "$BASE"
          planlint --target /tmp/base graph --format json > base.json
          git worktree remove /tmp/base

      - name: Diff graphs (fail on new broken edges or orphans)
        run: python tools/diff_spec_graph.py base.json head.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-graph-diff
          path: |
            base.json
            head.json

  security:
    # Secret scan + no-hardcoded-threshold guard (AC-EH-3, AC-EH-6). gitleaks
    # is the real scanner; the no-hardcoded check is a Python script that reads
    # the Makefile and this workflow and fails on a pinned number or tool version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: No hard-coded thresholds in Makefile / workflow (hard gate)
        run: python tools/check_no_hardcoded_thresholds.py

      - name: gitleaks (hard gate — committed secrets fail the build)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    # The documentation set must exist and be linked from README (AC-EH-8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: make docs-check
